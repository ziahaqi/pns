version: "3.9"

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: pns
      POSTGRES_PASSWORD: pns
      POSTGRES_DB: pns
    ports:
      - "5432:5432"
    volumes:
      - db-data:/var/lib/postgresql/data

  app:
    build: .
    depends_on:
      - db
    environment:
      APP_PORT: "8080"
      DATABASE_URL: postgres://pns:pns@db:5432/pns?sslmode=disable
      SERVER_KEY: "dev-server-key-change-me"
      SESSION_SECRET: "change-me-session-secret"
      FCM_SERVER_KEY: ""
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: admin123
    ports:
      - "8080:8080"
    restart: unless-stopped

volumes:
  db-data:

